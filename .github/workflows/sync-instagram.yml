name: Sync Instagram feed

# Instagram has no "new post" webhook — Meta only publishes events for comments, mentions
# and messages — so the only way to stay current is to poll.
#
# Polling every 10 minutes would normally mean 144 full builds a day. It doesn't here: the
# `check` job makes one cheap API call and compares the newest post id against what is
# already committed. Only when that differs does the `sync` job install anything. A quiet
# day costs a few seconds of runner time, and public repositories bill none of it.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # so you can force a sync without waiting

concurrency:
  group: sync-instagram
  cancel-in-progress: false # never interrupt a run that is mid-commit

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Is there a post we don't have?
        id: compare
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$IG_USER_ID" ]; then
            echo "Instagram secrets are not set yet — nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(curl -fsS "https://graph.instagram.com/v26.0/$IG_USER_ID/media?fields=id&limit=1&access_token=$IG_ACCESS_TOKEN" \
            | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([0-9]*\)".*/\1/p')

          if [ -z "$latest" ]; then
            echo "::warning::Could not read the latest post id — the token may have expired."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -q "\"$latest\"" frontend/src/content/instagram.ts; then
            echo "Already have post $latest."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New post $latest — syncing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

  sync:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Pull the latest posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: pnpm sync-instagram

      # The content file is typed and Zod-validated, so this catches a malformed API
      # response here rather than on the deploy that follows.
      - name: Verify the result builds
        run: pnpm typecheck && pnpm test

      - name: Commit the feed
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/content/instagram.ts frontend/public/images/instagram
          if git diff --staged --quiet; then
            echo "Nothing changed after all."
            exit 0
          fi
          git commit -m "chore(content): sync Instagram feed"
          git push
